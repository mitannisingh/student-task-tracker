<!DOCTYPE html>
<html>
<head>
    <title>Student Task Tracker</title>
</head>
<body>

    <h1>Student Task Tracker</h1>

    <form action="/add" method="POST">
        <input type="text" name="title" placeholder="Enter a task" required>
        <button type="submit">Add Task</button>
    </form>

    <h2>Tasks</h2>

    {% if tasks %}
        <ul>
            {% for task in tasks %}
                <li>
                    {% if task.completed %}
                        <s>{{ task.title }}</s>
                    {% else %}
                        {{ task.title }}
                    {% endif %}

                    <a href="/complete/{{ task.id }}">Complete</a>
                    <a href="/delete/{{ task.id }}">Delete</a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No tasks yet.</p>
    {% endif %}

</body>
</html>
